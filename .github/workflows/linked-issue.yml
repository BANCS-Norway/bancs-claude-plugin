name: Linked issue

# A PR must link an issue (#46): a closing keyword in the description (`Closes #N`), GitHub's own link from the
# sidebar, or `Part of #N` in the description for work that spans PRs. Runs on `edited` so fixing the description
# turns the check green without a new push. A sidebar-only link fires no event: re-run the check after it.
# scripts/linked-issue.mjs holds the rule and its tests.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  linked-issue:
    runs-on: ubuntu-latest
    name: Linked issue
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Require a linked issue
        run: node scripts/linked-issue.mjs <<< "${{ github.event.pull_request.number }}"
        env:
          GH_TOKEN: ${{ github.token }}
